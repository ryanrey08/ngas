# Production: standalone Next.js server, no source mounts, read-only root filesystem.
services:
  frontend:
    image: ${FRONTEND_IMAGE:-ngas-frontend}:${FRONTEND_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Inlined into the browser bundle at BUILD time; rebuild after changing them.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/backend}
        NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:-mock}
        NEXT_PUBLIC_API_TIMEOUT: ${NEXT_PUBLIC_API_TIMEOUT:-15000}
    ports:
      # Bind to 127.0.0.1 when a reverse proxy on the same host terminates TLS.
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # Keeps Node's heap under the container limit below, so it collects
      # garbage instead of being killed when it reaches the limit.
      NODE_OPTIONS: --max-old-space-size=256
    # Several apps share a 2 GB server: one busy app must not starve the others.
    mem_limit: ${FRONTEND_MEM_LIMIT:-384m}
    read_only: true
    tmpfs:
      # Next.js image-optimisation / fetch cache; the only path the server writes to.
      - /app/.next/cache:uid=1001,gid=1001,mode=0755
      - /tmp
    healthcheck:
      # busybox wget instead of starting a second Node process every 30s.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
