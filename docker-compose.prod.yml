# Production: standalone Next.js server, no source mounts, read-only root filesystem.
services:
  frontend:
    image: ${FRONTEND_IMAGE:-ngas-frontend}:${FRONTEND_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Inlined into the browser bundle at BUILD time; rebuild after changing them.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/backend}
        NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:-mock}
        NEXT_PUBLIC_API_TIMEOUT: ${NEXT_PUBLIC_API_TIMEOUT:-15000}
    ports:
      # Bind to 127.0.0.1 when a reverse proxy on the same host terminates TLS.
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    read_only: true
    tmpfs:
      # Next.js image-optimisation / fetch cache; the only path the server writes to.
      - /app/.next/cache:uid=1001,gid=1001,mode=0755
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
